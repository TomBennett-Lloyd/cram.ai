packages:
  - 'apps/*'
  - 'packages/*'
  - 'eval'

# Supply-chain quarantine: a version published less than 24h ago is not resolved,
# so a compromised release has to survive a day of public scrutiny before it can
# reach this repo. 1440 minutes is pnpm's own default — the point of writing it
# down is `minimumReleaseAgeStrict` below, which pnpm auto-enables only when the
# age is set EXPLICITLY. Left implicit, pnpm 11.18 runs the policy in "loose"
# mode: an install that trips the cutoff does not fail, it appends the offending
# versions to `minimumReleaseAgeExclude` in this file and proceeds. The gate
# quietly writes its own exemption, and the exemption is then committed. See
# cumulo#92 (https://github.com/TomBennett-Lloyd/cumulo/issues/92) for the
# reproduction; `check:supply-chain-policy` in `verify` is the backstop for the
# paths strict mode does not cover (`pnpm audit --fix`, and an approved
# interactive prompt), which can still add entries below.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

allowBuilds:
  # esbuild is a root devDependency because .claude/scripts/verify-tier.sh's
  # source-prose rung runs it. pnpm installs @esbuild/<platform> and the bin shim
  # resolves that binary at runtime, so the rung works without the install
  # script, and not running install-time code is the safer default. The
  # source-prose cases in .claude/scripts/verify-tier.test.sh run that shim.
  esbuild: false
  # better-sqlite3 (@cram/index, #11) ships its N-API binaries under prebuilds/ in
  # the tarball and loads them from there; pnpm reports a build only because the
  # package also carries binding.gyp. Allowing it would run node-gyp, which
  # downloads Node headers at install time unless already cached.
  better-sqlite3: false
  # onnxruntime-node (@cram/gateway, #66) ships its N-API binaries for every
  # platform under bin/napi-v6/ in the tarball and loads them from there. Its
  # postinstall (script/install.js) fetches only the CUDA execution provider,
  # and only on linux-x64, from api.nuget.org; the CPU provider needs nothing.
  onnxruntime-node: false
